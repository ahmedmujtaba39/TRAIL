[project]
name = "trail-sign"
version = "0.1.0"
description = "TRAIL: phonology-conditioned transition transfer for continuous sign language recognition"
readme = "EXPERIMENT.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.scripts]
trail-smoke = "trail.smoke:main"
trail-validate = "trail.validate:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trail"]
