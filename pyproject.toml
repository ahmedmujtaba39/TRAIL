[project]
name = "trail-sign"
version = "0.1.0"
description = "TRAIL: phonology-conditioned transition transfer for continuous sign language recognition"
readme = "EXPERIMENT.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "mediapipe>=1.0",
  "opencv-python>=5.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.scripts]
trail-smoke = "trail.smoke:main"
trail-validate = "trail.validate:main"
trail-prepare-qsl = "trail.prepare_qsl:main"
trail-prepare-isharah = "trail.prepare_isharah:main"
trail-extract-svo = "trail.extract_svo:main"
trail-extract-pose = "trail.extract_pose:main"
trail-extract-hand-pose = "trail.extract_hand_pose:main"
trail-build-handshape-examples = "trail.build_handshape_examples:main"
trail-train-handshape = "trail.train_handshape:main"
trail-prepare-reference-handshapes = "trail.prepare_reference_handshapes:main"
trail-train-reference-handshape = "trail.train_reference_handshape:main"
trail-prepare-3dz-phonology = "trail.prepare_3dz_phonology:main"
trail-render-3dz-handshapes = "trail.render_3dz_handshapes:main"
trail-build-3dz-handshape-examples = "trail.build_3dz_handshape_examples:main"
trail-prepare-karsl-handshape = "trail.prepare_karsl_handshape:main"
trail-batch-qsl-pose = "trail.batch_qsl_pose:main"
trail-batch-qsl-hand-pose = "trail.batch_qsl_hand_pose:main"
trail-batch-isharah-pose = "trail.batch_isharah_pose:main"
trail-batch-isharah-hand-pose = "trail.batch_isharah_hand_pose:main"
trail-prepare-transitions = "trail.prepare_transitions:main"
trail-train-transition = "trail.train_transition:main"
trail-synthesize = "trail.synthesize:main"
trail-run-ctc = "trail.run_ctc:main"
trail-prepare-oracle = "trail.prepare_oracle:main"
trail-trim = "trail.trim:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trail"]
